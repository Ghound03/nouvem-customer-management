<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOUVEM Customer Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 4px;
        }

        header p {
            color: #d1d5db;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        section {
            margin-bottom: 35px;
        }

        section h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* Dashboard */

        #dashboard-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .dashboard-card {
            background-color: white;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .dashboard-card h3 {
            font-size: 28px;
        }

        /* Customer header */

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .customer-header h2 {
            margin-bottom: 0;
        }

        #add-customer-button {
            border: none;
            background-color: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #add-customer-button:hover {
            background-color: #1d4ed8;
        }

        /* Search and filter */

        .customer-tools {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .customer-tools input,
        .customer-tools select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .customer-tools input {
            flex: 1;
        }

        .customer-tools select {
            min-width: 180px;
        }

        /* Customer form */

        #customer-form-container {
            display: none;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        #customer-form-container h3 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-button {
            border: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #1d4ed8;
        }

        .cancel-button {
            border: 1px solid #d1d5db;
            background-color: white;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-button:hover {
            background-color: #f3f4f6;
        }

        /* Customer table */

        #customer-list {
            background-color: white;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        /* Status labels */

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-implementation {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .status-support {
            background-color: #fef3c7;
            color: #92400e;
        }

        /* Action buttons */

        .action-button {
            border: 1px solid #d1d5db;
            background-color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .action-button:hover {
            background-color: #f3f4f6;
        }

        .delete-button {
            color: #dc2626;
        }

        /* Feedback messages */

        #message-container {
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        #message-container[hidden] {
            display: none;
        }

        .message-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .message-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        /* Responsive layout */

        @media (max-width: 800px) {
            #dashboard-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .customer-tools {
                flex-direction: column;
            }

            .customer-tools select {
                width: 100%;
            }

            .customer-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {
            #dashboard-cards {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }
        }

            #empty-state {
               padding: 24px;
               color: #6b7280;
               text-align: center;
            }

            #empty-state[hidden] {
               display: none;
            }

            @media (max-width: 600px) {
    th,
    td {
        padding: 12px;
        white-space: nowrap;
    }

    .action-button {
        margin-bottom: 5px;
    }
}
    </style>
</head>

<body>

    <header>
        <h1>NOUVEM</h1>
        <p>Customer Management System</p>
    </header>

    <main>

        <!-- Dashboard -->

        <section id="dashboard">

            <h2>Dashboard</h2>

            <div id="dashboard-cards">

                <div class="dashboard-card">
                    <p>Total Customers</p>
                    <h3 id="total-customers">0</h3>
                </div>

                <div class="dashboard-card">
                    <p>Active Customers</p>
                    <h3 id="active-customers">0</h3>
                </div>

                <div class="dashboard-card">
                    <p>Implementations</p>
                    <h3 id="implementation-customers">0</h3>
                </div>

                <div class="dashboard-card">
                    <p>Support Required</p>
                    <h3 id="support-customers">0</h3>
                </div>

            </div>

        </section>

        <!-- Customers -->

        <section id="customers">

            <!-- Feedback messages -->

            <div
                id="message-container"
                role="status"
                aria-live="polite"
                hidden>
            </div>

            <div class="customer-header">

                <h2>Customers</h2>

                <button id="add-customer-button" type="button">
                    + Add Customer
                </button>

            </div>

            <!-- Search and filter -->

            <div class="customer-tools">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search customers..."
                    aria-label="Search customers"
                >

                <select
                    id="status-filter"
                    aria-label="Filter customers by status"
                >
                    <option value="All">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Implementation">Implementation</option>
                    <option value="Support Required">Support Required</option>
                </select>

            </div>

            <!-- Customer form -->

            <div id="customer-form-container">

                <h3>Add Customer</h3>

                <form id="customer-form">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="company">Company Name</label>
                            <input
                                type="text"
                                id="company"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="contact">Contact Person</label>
                            <input
                                type="text"
                                id="contact"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <input
                                type="text"
                                id="location"
                                required
                            >
                        </div>

                        <div class="form-group">

                            <label for="status">Status</label>

                            <select id="status" required>
                                <option value="Active">Active</option>
                                <option value="Implementation">Implementation</option>
                                <option value="Support Required">Support Required</option>
                            </select>

                        </div>

                    </div>

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            Save Customer
                        </button>

                        <button
                            type="button"
                            id="cancel-button"
                            class="cancel-button"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

            <!-- Customer table -->

            <div id="customer-list">

                <table>

                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="customer-table-body">
                        <!-- JavaScript generates customer rows here -->
                    </tbody>

                </table>

                <p id="empty-state" hidden>
                   No customers match your search or filter.
                </p>

            </div>

        </section>

    </main>

    <script>

        // Get HTML elements

        const addCustomerButton =
            document.getElementById("add-customer-button");

        const customerFormContainer =
            document.getElementById("customer-form-container");

        const customerForm =
            document.getElementById("customer-form");

        const cancelButton =
            document.getElementById("cancel-button");

        const customerTableBody =
            document.getElementById("customer-table-body");

        const searchInput =
            document.getElementById("search-input");

        const statusFilter =
            document.getElementById("status-filter");

        const messageContainer =
            document.getElementById("message-container");


        // Default customer data

        const defaultCustomers = [
            {
                company: "GreenFields Foods",
                contact: "Sarah Kelly",
                email: "sarah@example.com",
                location: "Dublin",
                status: "Active"
            },
            {
                company: "Irish Protein Ltd",
                contact: "John Murphy",
                email: "john@example.com",
                location: "Cork",
                status: "Implementation"
            },
            {
                company: "Emerald Meats",
                contact: "Emma Byrne",
                email: "emma@example.com",
                location: "Meath",
                status: "Active"
            },
            {
                company: "Atlantic Foods",
                contact: "Michael Ryan",
                email: "michael@example.com",
                location: "Galway",
                status: "Support Required"
            }
        ];


        // Load saved customers from localStorage

        let customers = JSON.parse(
            localStorage.getItem("nouvemCustomers")
        );

        if (customers === null) {
            customers = defaultCustomers;
            saveCustomers();
        }


        // null means we are adding a new customer.
        // A number means we are editing an existing customer.

        let editingIndex = null;


        // Save customer data

        function saveCustomers() {

            localStorage.setItem(
                "nouvemCustomers",
                JSON.stringify(customers)
            );

        }


        // Get the correct CSS class for a status

        function getStatusClass(status) {

            if (status === "Active") {
                return "status-active";
            }

            if (status === "Implementation") {
                return "status-implementation";
            }

            return "status-support";

        }


        // Display feedback messages

        function showMessage(message, type) {

            messageContainer.textContent = message;

            messageContainer.className =
                type === "success"
                    ? "message-success"
                    : "message-error";

            messageContainer.hidden = false;

        }


        // Clear previous feedback messages

        function clearMessage() {

            messageContainer.textContent = "";

            messageContainer.className = "";

            messageContainer.hidden = true;

        }


        // Validate customer information

        function validateCustomer(customer) {

            // Prevent empty fields

            if (
                !customer.company ||
                !customer.contact ||
                !customer.email ||
                !customer.location
            ) {
                return "Please complete all customer fields.";
            }


            // Prevent duplicate company names

            const duplicateCompany = customers.some(function (
                existingCustomer,
                index
            ) {

                return (
                    index !== editingIndex &&
                    existingCustomer.company.toLowerCase() ===
                        customer.company.toLowerCase()
                );

            });

            if (duplicateCompany) {
                return "A customer with this company name already exists.";
            }


            // Prevent duplicate email addresses

            const duplicateEmail = customers.some(function (
                existingCustomer,
                index
            ) {

                return (
                    index !== editingIndex &&
                    existingCustomer.email.toLowerCase() ===
                        customer.email.toLowerCase()
                );

            });

            if (duplicateEmail) {
                return "A customer with this email address already exists.";
            }


            // No validation errors

            return null;

        }


        // Update dashboard statistics

        function updateDashboard() {

            const total = customers.length;

            const active = customers.filter(function (customer) {
                return customer.status === "Active";
            }).length;

            const implementation = customers.filter(function (customer) {
                return customer.status === "Implementation";
            }).length;

            const support = customers.filter(function (customer) {
                return customer.status === "Support Required";
            }).length;


            document.getElementById("total-customers").textContent =
                total;

            document.getElementById("active-customers").textContent =
                active;

            document.getElementById("implementation-customers").textContent =
                implementation;

            document.getElementById("support-customers").textContent =
                support;

        }


        // Search and filter customers

        function filterCustomers() {

    const searchValue =
        searchInput.value.toLowerCase().trim();

    const selectedStatus =
        statusFilter.value;

    const rows =
        customerTableBody.querySelectorAll("tr");

    let visibleCount = 0;

    rows.forEach(function (row) {

        const index = Number(row.dataset.index);
        const customer = customers[index];

        const matchesSearch =
            customer.company.toLowerCase().includes(searchValue) ||
            customer.contact.toLowerCase().includes(searchValue) ||
            customer.email.toLowerCase().includes(searchValue) ||
            customer.location.toLowerCase().includes(searchValue);

        const matchesStatus =
            selectedStatus === "All" ||
            customer.status === selectedStatus;

        const isVisible = matchesSearch && matchesStatus;

        row.style.display = isVisible ? "" : "none";

        if (isVisible) {
            visibleCount++;
        }

    });

    const emptyState =
        document.getElementById("empty-state");

    emptyState.hidden = visibleCount > 0;

    emptyState.textContent =
        customers.length === 0
            ? "No customers yet. Add your first customer to get started."
            : "No customers match your search or filter.";
}


        // Render all customers in the table

        function renderCustomers() {

            // Remove existing rows

            customerTableBody.replaceChildren();


            customers.forEach(function (customer, index) {

                // Create table row

                const row =
                    document.createElement("tr");

                row.dataset.index = index;


                // Create text cells safely

                ["company", "contact", "email", "location"].forEach(
                    function (field) {

                        const cell =
                            document.createElement("td");

                        cell.textContent = customer[field];

                        row.appendChild(cell);

                    }
                );


                // Create status cell

                const statusCell =
                    document.createElement("td");

                const statusBadge =
                    document.createElement("span");

                statusBadge.className =
                    "status " + getStatusClass(customer.status);

                statusBadge.textContent =
                    customer.status;

                statusCell.appendChild(statusBadge);

                row.appendChild(statusCell);


                // Create action buttons

                const actionsCell =
                    document.createElement("td");

                const editButton =
                    document.createElement("button");

                editButton.type = "button";

                editButton.className =
                    "action-button edit-button";

                editButton.textContent = "Edit";


                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";

                deleteButton.className =
                    "action-button delete-button";

                deleteButton.textContent = "Delete";


                actionsCell.append(editButton, deleteButton);

                row.appendChild(actionsCell);


                // Add row to table

                customerTableBody.appendChild(row);

            });


            // Refresh dashboard and filters

            updateDashboard();

            filterCustomers();

        }


        // Open Add Customer form

        addCustomerButton.addEventListener("click", function () {

            clearMessage();

            editingIndex = null;

            customerForm.reset();

            document.querySelector(
                "#customer-form-container h3"
            ).textContent = "Add Customer";

            document.querySelector(
                ".save-button"
            ).textContent = "Save Customer";

            customerFormContainer.style.display = "block";

        });


        // Cancel customer form

        cancelButton.addEventListener("click", function () {

            customerForm.reset();

            customerFormContainer.style.display = "none";

            editingIndex = null;

            clearMessage();

        });


        // Create or update customer

        customerForm.addEventListener("submit", function (event) {

            event.preventDefault();


            // Collect form values

            const customer = {

                company:
                    document.getElementById("company").value.trim(),

                contact:
                    document.getElementById("contact").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                location:
                    document.getElementById("location").value.trim(),

                status:
                    document.getElementById("status").value

            };


            // Check for validation errors

            const validationError =
                validateCustomer(customer);

            if (validationError) {

                showMessage(validationError, "error");

                return;

            }


            // Update existing customer

            if (editingIndex !== null) {

                customers[editingIndex] = customer;

                showMessage(
                    "Customer updated successfully.",
                    "success"
                );

            } else {

                // Create new customer

                customers.push(customer);

                showMessage(
                    "Customer added successfully.",
                    "success"
                );

            }


            // Save data and refresh the page content

            saveCustomers();

            renderCustomers();


            // Reset form

            editingIndex = null;

            customerForm.reset();

            customerFormContainer.style.display = "none";

            document.querySelector(
                "#customer-form-container h3"
            ).textContent = "Add Customer";

            document.querySelector(
                ".save-button"
            ).textContent = "Save Customer";

        });


        // Handle Edit and Delete buttons

        customerTableBody.addEventListener("click", function (event) {

            const row =
                event.target.closest("tr");

            if (!row) {
                return;
            }

            const index =
                Number(row.dataset.index);


            // Edit customer

            if (event.target.classList.contains("edit-button")) {

                clearMessage();

                const customer =
                    customers[index];

                editingIndex = index;


                // Fill form with existing customer information

                document.getElementById("company").value =
                    customer.company;

                document.getElementById("contact").value =
                    customer.contact;

                document.getElementById("email").value =
                    customer.email;

                document.getElementById("location").value =
                    customer.location;

                document.getElementById("status").value =
                    customer.status;


                // Update form heading and button

                document.querySelector(
                    "#customer-form-container h3"
                ).textContent = "Edit Customer";

                document.querySelector(
                    ".save-button"
                ).textContent = "Update Customer";


                // Show form

                customerFormContainer.style.display = "block";

                customerFormContainer.scrollIntoView({
                    behavior: "smooth"
                });

            }


            // Delete customer

            if (event.target.classList.contains("delete-button")) {

                const customer =
                    customers[index];

                const confirmed = confirm(
                    `Are you sure you want to delete ${customer.company}?`
                );


                if (confirmed) {

                    // Remove customer from array

                    customers.splice(index, 1);


                    // Clear any open edit form

                    editingIndex = null;

                    customerForm.reset();

                    customerFormContainer.style.display = "none";


                    // Save and refresh

                    saveCustomers();

                    renderCustomers();


                    // Display confirmation

                    showMessage(
                        `${customer.company} deleted successfully.`,
                        "success"
                    );

                }

            }

        });


        // Search when the user types

        searchInput.addEventListener(
            "input",
            filterCustomers
        );


        // Filter when the status changes

        statusFilter.addEventListener(
            "change",
            filterCustomers
        );


        // Display customers when the page first loads

        renderCustomers();

    </script>

</body>
</html>
